<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIRAN ABAYA — Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #120f0e;
      --surface: #1b1614;
      --surface-2: #241e1b;
      --text: #f5efe6;
      --muted: #c2b6a8;
      --accent: #f5efe6;
      --accent-dark: #151110;
      --gold: #e5c384;
      --danger: #e06c6c;
      --ok: #6fd395;
      --border: rgba(245, 239, 230, 0.14);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input, select, textarea { font-family: inherit; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .head-wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .pill-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .pill-btn.primary {
      background: var(--accent);
      color: var(--accent-dark);
      border-color: var(--accent);
      font-weight: 600;
    }

    .pill-btn.danger {
      border-color: rgba(224, 108, 108, 0.4);
      color: var(--danger);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }

    .panel h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .list-item {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .badge {
      font-size: 0.74rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(229, 195, 132, 0.15);
      color: var(--gold);
      border: 1px solid rgba(229, 195, 132, 0.35);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .pre-notes {
      white-space: pre-wrap;
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .auth-box {
      max-width: 420px;
      margin: 60px auto;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 20px;
    }

    @media (max-width: 600px) {
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="head-wrap">
      <div class="brand">MIRAN ABAYA · ADMIN</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <a href="./index.html" class="pill-btn">View Store</a>
        <button type="button" class="pill-btn" id="authBtn" onclick="handleAuth()">Sign In</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Login / Access Guard -->
    <div id="authGate" class="auth-box">
      <h2 style="margin-bottom:8px;">Admin Access Only</h2>
      <p id="gateMsg" style="color:var(--muted); font-size:0.9rem; margin-bottom:16px;">
        Sign in with your owner Google account to manage products and orders.
      </p>
      <button type="button" class="pill-btn primary" onclick="signInGoogle()">Sign in with Google</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboard" style="display:none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Paid Revenue</div>
          <div class="stat-val" id="statRevenue">0 ETB</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Orders</div>
          <div class="stat-val" id="statOrders">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Products</div>
          <div class="stat-val" id="statProducts">0</div>
        </div>
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabOrdersBtn" onclick="switchTab('orders')">Orders</button>
        <button type="button" class="tab-btn" id="tabProductsBtn" onclick="switchTab('products')">Products</button>
      </div>

      <!-- ORDERS TAB -->
      <section id="ordersSection">
        <div class="panel">
          <h2>Customer &amp; Custom Orders</h2>
          <input type="search" id="orderSearch" placeholder="Search by name, phone, or status..." oninput="renderOrders()" style="margin-bottom:12px;" />
          <div id="ordersList">Loading orders...</div>
        </div>
      </section>

      <!-- PRODUCTS TAB -->
      <section id="productsSection" style="display:none;">
        <div class="panel">
          <h2>Add New Product</h2>
          <form class="form-grid" id="addProductForm" onsubmit="addProduct(event)">
            <div class="two-col">
              <input type="text" id="pName" placeholder="Product Name (e.g. Dubai Silk Abaya)" required />
              <input type="number" id="pPrice" placeholder="Price in ETB (e.g. 4500)" required />
            </div>
            <div class="two-col">
              <select id="pCategory">
                <option value="">Select Category (Optional)</option>
              </select>
              <input type="url" id="pImage" placeholder="Image URL (https://...)" required />
            </div>
            <textarea id="pDesc" rows="2" placeholder="Description (fabric, color, sizes...)"></textarea>
            <button type="submit" class="pill-btn primary" style="padding:11px;">+ Add Product</button>
          </form>
        </div>

        <div class="panel">
          <h2>Manage Products</h2>
          <div id="productsList">Loading products...</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://htwwaxpvmxlvxermsver.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fFLpRv1_3-PAXzop8yA1Hw_IprKuI-e';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let allOrders = [];
    let allProducts = [];
    let allCategories = [];

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    async function signInGoogle() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
    }

    async function handleAuth() {
      if (!currentUser) {
        await signInGoogle();
      } else {
        await sb.auth.signOut();
        window.location.reload();
      }
    }

    async function checkAdminAccess() {
      const { data: { user } } = await sb.auth.getUser();
      currentUser = user;

      if (!user) {
        document.getElementById('authGate').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('authBtn').textContent = 'Sign In';
        return;
      }

      document.getElementById('authBtn').textContent = 'Sign Out';

      const { data: profile, error } = await sb
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      const role = String(profile?.role || '').toLowerCase();
      if (error || (role !== 'admin' && role !== 'owner')) {
        document.getElementById('authGate').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('gateMsg').textContent =
          `Access denied for ${user.email}. Set role to "owner" or "admin" in Supabase profiles table.`;
        return;
      }

      document.getElementById('authGate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      await Promise.all([loadCategories(), loadProducts(), loadOrders()]);
    }

    function switchTab(tab) {
      const isOrders = tab === 'orders';
      document.getElementById('ordersSection').style.display = isOrders ? 'block' : 'none';
      document.getElementById('productsSection').style.display = isOrders ? 'none' : 'block';
      document.getElementById('tabOrdersBtn').classList.toggle('active', isOrders);
      document.getElementById('tabProductsBtn').classList.toggle('active', !isOrders);
    }

    async function loadCategories() {
      const { data } = await sb.from('categories').select('id, name').order('name');
      allCategories = data || [];
      const sel = document.getElementById('pCategory');
      sel.innerHTML = '<option value="">Select Category (Optional)</option>' +
        allCategories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    }

    async function loadOrders() {
      const { data, error } = await sb
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('ordersList').innerHTML = `<p style="color:var(--danger);">${esc(error.message)}</p>`;
        return;
      }

      allOrders = data || [];
      updateStats();
      renderOrders();
    }

    function updateStats() {
      const paidOrders = allOrders.filter(o => ['paid', 'delivered', 'deposit_paid'].includes(String(o.status || '').toLowerCase()));
      const revenue = paidOrders.reduce((sum, o) => {
        const amt = Number(o.total_amount || 0);
        return sum + (String(o.status).toLowerCase() === 'deposit_paid' ? Math.round(amt * 0.5) : amt);
      }, 0);

      document.getElementById('statRevenue').textContent = `${revenue.toLocaleString()} ETB`;
      document.getElementById('statOrders').textContent = allOrders.length;
      document.getElementById('statProducts').textContent = allProducts.filter(p => p.is_active).length;
    }

    function renderOrders() {
      const wrap = document.getElementById('ordersList');
      const q = (document.getElementById('orderSearch').value || '').toLowerCase().trim();

      const filtered = allOrders.filter(o =>
        !q ||
        (o.customer_name || '').toLowerCase().includes(q) ||
        (o.customer_phone || '').toLowerCase().includes(q) ||
        (o.status || '').toLowerCase().includes(q)
      );

      if (!filtered.length) {
        wrap.innerHTML = '<p style="color:var(--muted);">No orders found.</p>';
        return;
      }

      wrap.innerHTML = filtered.map(o => `
        <div class="list-item">
          <div class="row-top">
            <div>
              <strong>${esc(o.customer_name || 'Customer')}</strong> · ${esc(o.customer_phone || '-')}
              <div style="font-size:0.84rem; color:var(--gold); font-weight:600;">
                ${Number(o.total_amount || 0).toLocaleString()} ETB
              </div>
            </div>
            <span class="badge">${esc(o.status || 'pending')}</span>
          </div>
          ${o.notes ? `<div class="pre-notes">${esc(o.notes)}</div>` : ''}
          <div class="actions">
            <select onchange="updateOrderStatus('${esc(o.id)}', this.value)" style="max-width:170px; padding:6px 10px; font-size:0.82rem;">
              <option value="pending_deposit" ${o.status === 'pending_deposit' ? 'selected' : ''}>pending_deposit</option>
              <option value="deposit_paid" ${o.status === 'deposit_paid' ? 'selected' : ''}>deposit_paid (50%)</option>
              <option value="paid" ${o.status === 'paid' ? 'selected' : ''}>paid (100%)</option>
              <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>delivered</option>
              <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>cancelled</option>
            </select>
            <button type="button" class="pill-btn" onclick="copyOrder(${JSON.stringify(o.notes || o.customer_name || '').replace(/"/g, '&quot;')})">Copy for Telegram</button>
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(id, status) {
      const { error } = await sb.from('orders').update({ status }).eq('id', id);
      if (error) {
        alert('Error updating status: ' + error.message);
        return;
      }
      await loadOrders();
    }

    function copyOrder(text) {
      navigator.clipboard?.writeText(text);
      alert('Order details copied!');
    }

    async function loadProducts() {
      const { data, error } = await sb
        .from('products')
        .select('*, categories(name)')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('productsList').innerHTML = `<p style="color:var(--danger);">${esc(error.message)}</p>`;
        return;
      }

      allProducts = data || [];
      updateStats();
      renderProducts();
    }

    async function addProduct(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const price = Number(document.getElementById('pPrice').value);
      const category_id = document.getElementById('pCategory').value || null;
      const image_url = document.getElementById('pImage').value.trim();
      const description = document.getElementById('pDesc').value.trim();

      const payload = { name, price, image_url, description, is_active: true };
      if (category_id) payload.category_id = category_id;

      const { error } = await sb.from('products').insert(payload);
      if (error) {
        alert('Error adding product: ' + error.message);
        return;
      }

      document.getElementById('addProductForm').reset();
      await loadProducts();
      alert('Product added!');
    }

    function renderProducts() {
      const wrap = document.getElementById('productsList');
      if (!allProducts.length) {
        wrap.innerHTML = '<p style="color:var(--muted);">No products yet.</p>';
        return;
      }

      wrap.innerHTML = allProducts.map(p => `
        <div class="list-item">
          <div class="row-top">
            <div style="display:flex; gap:10px; align-items:center;">
              <img src="${esc(p.image_url || '')}" alt="" style="width:52px; height:64px; object-fit:cover; border-radius:8px; background:#120f0e;" />
              <div>
                <strong>${esc(p.name)}</strong>
                <div style="font-size:0.84rem; color:var(--gold);">${Number(p.price || 0).toLocaleString()} ETB</div>
                <div style="font-size:0.78rem; color:var(--muted);">${esc(p.categories?.name || 'Uncategorized')}</div>
              </div>
            </div>
            <span class="badge">${p.is_active ? 'Active' : 'Hidden'}</span>
          </div>
          <div class="actions">
            <button type="button" class="pill-btn" onclick="toggleProductActive('${esc(p.id)}', ${!p.is_active})">
              ${p.is_active ? 'Hide' : 'Activate'}
            </button>
            <button type="button" class="pill-btn danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleProductActive(id, nextState) {
      const { error } = await sb.from('products').update({ is_active: nextState }).eq('id', id);
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      await loadProducts();
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product permanently?')) return;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      await loadProducts();
    }

    checkAdminAccess();
  </script>
</body>
</html>
