<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRAN ABAYA | የባለቤት ዳሽቦርድ</title>
<style>
  :root {
    --black: #000; --ivory: #FBF8F0; --gold: #C9A96E; --gold-deep: #8F7440; --beige: #E7DAC5;
    --bg: #FBF8F0; --panel: #FFFFFF; --ink: #1B1712; --muted: #6A604F; --line: rgba(27,23,18,.16);
    --danger: #9B2C2C; --ok: #276749;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0C0A08; --panel: #17130F; --ink: #F3ECDD; --muted: #B3A78F; --line: rgba(243,236,221,.18); --gold-deep: #C9A96E; --danger: #E08A8A; --ok: #68D391; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); line-height: 1.7;
    font-family: "Noto Sans Ethiopic", "Nyala", "Abyssinica SIL", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .top { background: #000; color: #F3ECDD; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top b { color: var(--gold); letter-spacing: .24em; font-weight: 400; }
  .top-right { display: flex; align-items: center; gap: 12px; font-size: .88rem; }
  .top-right a { color: var(--gold); text-decoration: none; }
  .top-right button { background: none; border: 1px solid rgba(243,236,221,.35); color: #F3ECDD; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: .84rem; }

  .gate {
    max-width: 440px; margin: 64px auto; background: var(--panel); border: 1px solid var(--line);
    padding: 28px; display: grid; gap: 14px;
  }
  .gate h1 { font-size: 1.35rem; margin-bottom: 4px; }
  .gate p { color: var(--muted); font-size: .9rem; }
  .gate input { background: transparent; border: 1px solid var(--line); padding: 10px 12px; border-radius: 3px; width: 100%; }
  .err { color: var(--danger); font-size: .88rem; }
  .ok { color: var(--ok); font-size: .88rem; }

  .layout { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 60px); }
  .side { border-right: 1px solid var(--line); padding: 20px 12px; display: grid; align-content: start; gap: 4px; }
  .side button {
    text-align: left; background: none; border: 0; padding: 10px 14px; border-radius: 4px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .side button:hover { background: rgba(201,169,110,.12); }
  .side button[aria-current="true"] { border-left-color: var(--gold); background: rgba(201,169,110,.16); }

  main { padding: 28px 24px 60px; max-width: 1020px; width: 100%; }
  h1 { font-weight: 500; font-size: 1.5rem; margin-bottom: 18px; }
  h2 { font-weight: 500; font-size: 1.15rem; margin-bottom: 12px; }
  .view { display: none; }
  .view.on { display: block; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; }
  .stat b { display: block; font-size: 1.8rem; font-weight: 500; color: var(--gold-deep); line-height: 1.2; }
  .stat span { color: var(--muted); font-size: .88rem; }

  form.add { background: var(--panel); border: 1px solid var(--line); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 30px; }
  .f { display: grid; gap: 4px; }
  .f.full { grid-column: 1 / -1; }
  .f label { font-size: .88rem; color: var(--muted); }
  .f input, .f select, .f textarea {
    background: transparent; border: 1px solid var(--line); padding: 10px 12px; border-radius: 3px; width: 100%;
  }
  .f select option { color: #000; }
  .f textarea { min-height: 80px; resize: vertical; }
  .preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .preview img { width: 64px; height: 80px; object-fit: cover; border: 1px solid var(--line); }
  .btn { background: var(--gold); color: #000; border: 0; padding: 11px 22px; border-radius: 3px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: #DDBF86; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); padding: 6px 12px; font-weight: 400; font-size: .86rem; }
  .btn.ghost:hover { border-color: var(--gold); }
  .btn.del { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: .92rem; vertical-align: middle; }
  th { color: var(--muted); font-weight: 400; font-size: .84rem; }
  td img { width: 44px; height: 56px; object-fit: cover; display: block; }
  .ph { width: 44px; height: 56px; background: var(--beige); display: grid; place-items: center; color: var(--gold-deep); font-size: .7rem; }
  .badge { font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); display: inline-block; }
  .badge.on { border-color: var(--gold); color: var(--gold-deep); }
  .low { color: var(--danger); font-weight: 600; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ord-box { background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px; }
  .ord-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
  .status-sel { border: 1px solid var(--gold); background: transparent; padding: 5px 10px; border-radius: 3px; font-size: .86rem; }
  .status-sel option { color: #000; }

  .empty { border: 1px dashed var(--gold-deep); padding: 36px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .side { grid-auto-flow: column; grid-auto-columns: 1fr; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    .side button { text-align: center; border-left: 0; border-bottom: 3px solid transparent; padding: 8px 4px; font-size: .86rem; }
    .side button[aria-current="true"] { border-bottom-color: var(--gold); }
    main { padding: 20px 16px 48px; }
    .stats { grid-template-columns: 1fr 1fr; }
    form.add { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top">
  <b>MIRAN ABAYA</b>
  <div class="top-right">
    <a href="index.html">ወደ ሱቁ ተመለስ</a>
    <button id="logoutBtn" style="display:none;">ውጣ</button>
  </div>
</div>

<!-- Auth Gate -->
<div id="authGate" class="gate">
  <h1>የባለቤት መግቢያ</h1>
  <p id="gateInfo">በባለቤት አካውንትዎ (Email &amp; Password) ይግቡ።</p>
  <form id="ownerLoginForm" style="display:grid;gap:12px;">
    <input id="loginEmail" type="email" placeholder="ኢሜይል" required>
    <input id="loginPass" type="password" placeholder="የይለፍ ቃል" required>
    <div id="gateErr" class="err"></div>
    <button type="submit" class="btn" id="loginBtn">ግባ</button>
  </form>
</div>

<!-- Dashboard Layout -->
<div id="dashLayout" class="layout" style="display:none;">
  <nav class="side" aria-label="ዋና ዝርዝር">
    <button data-view="home" aria-current="true">ዳሽቦርድ</button>
    <button data-view="products" aria-current="false">ምርቶች</button>
    <button data-view="orders" aria-current="false">ትዕዛዞች</button>
    <button data-view="customers" aria-current="false">ደንበኞች</button>
  </nav>

  <main>
    <!-- Overview -->
    <section class="view on" id="v-home">
      <h1>ዳሽቦርድ</h1>
      <div class="stats">
        <div class="stat"><b id="s-products">0</b><span>ምርቶች</span></div>
        <div class="stat"><b id="s-stock">0</b><span>ጠቅላላ ክምችት</span></div>
        <div class="stat"><b id="s-orders">0</b><span>ጠቅላላ ትዕዛዞች</span></div>
        <div class="stat"><b id="s-pending">0</b><span>በመጠባበቅ ላይ</span></div>
      </div>
      <div id="homeNote" class="empty">ከግራ በኩል ባለው ዝርዝር ምርቶችን፣ ትዕዛዞችን እና ደንበኞችን ያስተዳድሩ።</div>
    </section>

    <!-- Products -->
    <section class="view" id="v-products">
      <h1>ምርቶች</h1>
      <h2>አዲስ ምርት ጨምር</h2>
      <form class="add" id="addForm">
        <div class="f full"><label for="name">የምርት ስም *</label><input id="name" required maxlength="120"></div>
        <div class="f"><label for="cat">ምድብ *</label><select id="cat" required></select></div>
        <div class="f"><label for="price">ዋጋ (ብር) *</label><input id="price" type="number" min="0" step="1" required></div>
        <div class="f"><label for="sizes">መጠኖች (በነጠላ ሰረዝ ይለዩ)</label><input id="sizes" placeholder="52, 54, 56, 58, 60"></div>
        <div class="f"><label for="colors">ቀለሞች (በነጠላ ሰረዝ ይለዩ)</label><input id="colors" placeholder="ጥቁር, ክሬም, ቡናማ"></div>
        <div class="f"><label for="stock">ክምችት (ብዛት) *</label><input id="stock" type="number" min="0" step="1" value="5" required></div>
        <div class="f"><label for="photos">ፎቶዎች (እስከ 5 ፎቶ)</label><input id="photos" type="file" accept="image/*" multiple></div>
        <div class="f full"><div class="preview" id="preview"></div></div>
        <div class="f full"><label for="desc">መግለጫ</label><textarea id="desc"></textarea></div>
        <div class="f full">
          <div id="prodMsg" style="margin-bottom:8px;"></div>
          <button class="btn" type="submit" id="saveProdBtn">ምርቱን አስቀምጥ</button>
        </div>
      </form>

      <h2>የተመዘገቡ ምርቶች</h2>
      <div id="list"></div>
    </section>

    <!-- Orders -->
    <section class="view" id="v-orders">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h1 style="margin:0;">ትዕዛዞች</h1>
        <button class="btn ghost" id="refreshOrders">አድስ</button>
      </div>
      <div id="ordersList"></div>
    </section>

    <!-- Customers -->
    <section class="view" id="v-customers">
      <h1>ደንበኞች</h1>
      <div id="customersList"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const { client: sb, configured } = window.initMiranSupabase();
  const esc = t => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };

  let categories = [];
  let products = [];
  let orders = [];
  let customers = [];
  let selectedFiles = [];

  if (!configured) {
    document.getElementById("gateInfo").textContent = "supabase-config.js ፋይል ውስጥ የራስዎን SUPABASE_URL እና SUPABASE_ANON_KEY አስገብተው ይመለሱ።";
    document.getElementById("loginBtn").disabled = true;
  }

  // --- Navigation ---
  const navBtns = document.querySelectorAll(".side button");
  navBtns.forEach(b => b.addEventListener("click", () => {
    navBtns.forEach(x => x.setAttribute("aria-current", x === b));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.view));
  }));

  // --- Owner Auth Check ---
  async function checkOwnerSession() {
    if (!configured || !sb) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      showGate("");
      return;
    }

    const { data: profile, error } = await sb
      .from("profiles")
      .select("role, full_name")
      .eq("id", session.user.id)
      .single();

    if (error || !profile || profile.role !== "owner") {
      await sb.auth.signOut();
      showGate("ይህ አካውንት የባለቤት (owner) ፈቃድ የለውም። በ Supabase SQL Editor ውስጥ የ schema.sql Step 7 ትዕዛዝን አሂዱ።");
      return;
    }

    document.getElementById("authGate").style.display = "none";
    document.getElementById("dashLayout").style.display = "grid";
    document.getElementById("logoutBtn").style.display = "inline-block";
    await loadAllData();
  }

  function showGate(msg) {
    document.getElementById("authGate").style.display = "grid";
    document.getElementById("dashLayout").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("gateErr").textContent = msg;
  }

  document.getElementById("ownerLoginForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!configured) return;
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("gateErr");
    errEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "በመግባት ላይ...";

    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPass").value
    });

    btn.disabled = false;
    btn.textContent = "ግባ";
    if (error) {
      errEl.textContent = error.message;
    } else {
      await checkOwnerSession();
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    showGate("");
  });

  // --- Image Compression before Upload to Supabase Storage ---
  function compressImage(file, maxWidth = 1000, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("File read failed"));
      reader.onload = ev => {
        const img = new Image();
        img.onerror = () => reject(new Error("Invalid image"));
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const cvs = document.createElement("canvas");
          cvs.width = Math.round(img.width * scale);
          cvs.height = Math.round(img.height * scale);
          cvs.getContext("2d").drawImage(img, 0, 0, cvs.width, cvs.height);
          cvs.toBlob(blob => {
            if (!blob) reject(new Error("Compression failed"));
            else resolve(blob);
          }, "image/jpeg", quality);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("photos").addEventListener("change", e => {
    const box = document.getElementById("preview");
    box.innerHTML = "";
    selectedFiles = [...e.target.files].slice(0, 5);
    selectedFiles.forEach(f => {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f);
      img.alt = "";
      box.appendChild(img);
    });
  });

  // --- Load All Dashboard Data ---
  async function loadAllData() {
    await Promise.all([loadCategories(), loadProducts(), loadOrders(), loadCustomers()]);
    updateStats();
  }

  async function loadCategories() {
    const { data } = await sb.from("categories").select("id, name_am, name_en").order("id");
    categories = data || [];
    document.getElementById("cat").innerHTML = categories
      .map(c => `<option value="${c.id}">${esc(c.name_am)} (${esc(c.name_en)})</option>`).join("");
  }

  async function loadProducts() {
    const { data } = await sb
      .from("products")
      .select("id, name, price, images, sizes, colors, stock, is_active, created_at, categories(name_am)")
      .order("created_at", { ascending: false });
    products = data || [];
    renderProducts();
    updateStats();
  }

  async function loadOrders() {
    const { data } = await sb
      .from("orders")
      .select("id, status, subtotal, discount_percent, discount_amount, total, phone, address, note, created_at, profiles(full_name), order_items(product_name, quantity, unit_price, size, color)")
      .order("created_at", { ascending: false });
    orders = data || [];
    renderOrders();
    updateStats();
  }

  async function loadCustomers() {
    const { data } = await sb
      .from("profiles")
      .select("id, full_name, phone, role, created_at")
      .order("created_at", { ascending: false });
    customers = data || [];
    renderCustomers();
  }

  function updateStats() {
    document.getElementById("s-products").textContent = products.length;
    document.getElementById("s-stock").textContent = products.reduce((n, p) => n + (p.stock || 0), 0);
    document.getElementById("s-orders").textContent = orders.length;
    document.getElementById("s-pending").textContent = orders.filter(o => o.status === "pending").length;
  }

  // --- Add Product ---
  document.getElementById("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("saveProdBtn");
    const msgEl = document.getElementById("prodMsg");
    msgEl.className = "";
    msgEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "ፎቶዎችን በመጫን ላይ...";

    try {
      const imageUrls = [];
      for (let i = 0; i < selectedFiles.length; i++) {
        const blob = await compressImage(selectedFiles[i]);
        const path = `${Date.now()}_${i}.jpg`;
        const { error: upErr } = await sb.storage
          .from("product-images")
          .upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from("product-images").getPublicUrl(path);
        imageUrls.push(pub.publicUrl);
      }

      btn.textContent = "ምርቱን በማስቀመጥ ላይ...";
      const csv = id => document.getElementById(id).value.split(",").map(x => x.trim()).filter(Boolean);

      const { error: insErr } = await sb.from("products").insert({
        name: document.getElementById("name").value.trim(),
        category_id: Number(document.getElementById("cat").value),
        price: Number(document.getElementById("price").value),
        sizes: csv("sizes"),
        colors: csv("colors"),
        stock: Number(document.getElementById("stock").value),
        description: document.getElementById("desc").value.trim() || null,
        images: imageUrls,
        is_active: true
      });
      if (insErr) throw insErr;

      e.target.reset();
      document.getElementById("preview").innerHTML = "";
      selectedFiles = [];
      msgEl.className = "ok";
      msgEl.textContent = "ምርቱ በተሳካ ሁኔታ ተመዝግቧል!";
      await loadProducts();
    } catch (err) {
      msgEl.className = "err";
      msgEl.textContent = "ስህተት፦ " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "ምርቱን አስቀምጥ";
    }
  });

  // --- Render Products ---
  function renderProducts() {
    const list = document.getElementById("list");
    if (!products.length) {
      list.innerHTML = '<div class="empty">እስካሁን ምርት አልጨመርክም። ከላይ ያለውን ቅጽ ተጠቀም።</div>';
      return;
    }
    list.innerHTML = `<table><thead><tr><th>ፎቶ</th><th>ስም</th><th>ዋጋ / ክምችት</th><th>ሁኔታ</th><th>ተግባር</th></tr></thead><tbody>` +
      products.map(p => {
        const photo = (p.images && p.images[0]) || "";
        return `<tr>
          <td>${photo ? `<img src="${esc(photo)}" alt="">` : '<div class="ph">ፎቶ</div>'}</td>
          <td>${esc(p.name)}<br><small style="color:var(--muted)">${esc(p.categories?.name_am || "")}${p.sizes?.length ? " · " + esc(p.sizes.join("/")) : ""}</small></td>
          <td>${Number(p.price).toLocaleString()} ብር<br><span class="${p.stock <= 2 ? "low" : ""}">${p.stock} ቁርጥራጭ</span></td>
          <td><span class="badge ${p.is_active ? "on" : ""}">${p.is_active ? "ለሽያጭ ክፍት" : "ተደብቋል"}</span></td>
          <td><div class="acts">
            <button class="btn ghost" data-act="stock" data-id="${p.id}">ክምችት</button>
            <button class="btn ghost" data-act="toggle" data-id="${p.id}">${p.is_active ? "ደብቅ" : "አሳይ"}</button>
            <button class="btn ghost del" data-act="del" data-id="${p.id}">ሰርዝ</button>
          </div></td>
        </tr>`;
      }).join("") + "</tbody></table>";
  }

  document.getElementById("list").addEventListener("click", async e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const p = products.find(x => x.id === b.dataset.id);
    if (!p) return;

    if (b.dataset.act === "toggle") {
      await sb.from("products").update({ is_active: !p.is_active }).eq("id", p.id);
      await loadProducts();
    } else if (b.dataset.act === "stock") {
      const val = prompt(`ለ "${p.name}" አዲስ የክምችት ብዛት ያስገቡ:`, String(p.stock));
      if (val !== null && !isNaN(val) && Number(val) >= 0) {
        await sb.from("products").update({ stock: Number(val) }).eq("id", p.id);
        await loadProducts();
      }
    } else if (b.dataset.act === "del") {
      if (confirm(`"${p.name}" መሰረዝ እርግጠኛ ነህ?`)) {
        await sb.from("products").delete().eq("id", p.id);
        await loadProducts();
      }
    }
  });

  // --- Render Orders ---
  const STATUS_LABELS = {
    pending: "በመጠባበቅ ላይ (Pending)",
    confirmed: "ተረጋግጧል (Confirmed)",
    paid: "ተከፍሏል (Paid)",
    processing: "በዝግጅት ላይ (Processing)",
    shipped: "ተልኳል (Shipped)",
    delivered: "ደርሷል (Delivered)",
    cancelled: "ተሰርዟል (Cancelled)"
  };

  function renderOrders() {
    const box = document.getElementById("ordersList");
    if (!orders.length) {
      box.innerHTML = '<div class="empty">እስካሁን ትዕዛዝ የለም።</div>';
      return;
    }
    box.innerHTML = orders.map(o => `
      <div class="ord-box">
        <div class="ord-top">
          <div>
            <strong>#${esc(o.id.slice(0, 8))}</strong> · ${esc(o.profiles?.full_name || "Customer")}<br>
            <small style="color:var(--muted)">📞 ${esc(o.phone)} · 📍 ${esc(o.address)}</small>
            ${o.note ? `<br><small style="color:var(--muted)">📝 ${esc(o.note)}</small>` : ""}
          </div>
          <div>
            <select class="status-sel" data-order-status="${o.id}">
              ${Object.entries(STATUS_LABELS).map(([k, lbl]) => `<option value="${k}" ${o.status === k ? "selected" : ""}>${lbl}</option>`).join("")}
            </select>
          </div>
        </div>
        <div style="font-size:.9rem;margin-bottom:8px;">
          ${(o.order_items || []).map(it =>
            `<div>• ${esc(it.product_name)} (${[it.color, it.size].filter(Boolean).join("/") || "Std"}) &times; ${it.quantity} = ${(Number(it.unit_price) * it.quantity).toLocaleString()} ብር</div>`
          ).join("")}
        </div>
        <div style="font-size:.9rem;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);">
          <span>ንዑስ ድምር: ${Number(o.subtotal).toLocaleString()} ብር</span>
          ${o.discount_percent > 0 ? `<span style="color:var(--ok);">ቅናሽ (${o.discount_percent}%): -${Number(o.discount_amount).toLocaleString()} ብር</span>` : ""}
          <strong style="color:var(--ink);">ጠቅላላ: ${Number(o.total).toLocaleString()} ብር</strong>
        </div>
      </div>`).join("");
  }

  document.getElementById("ordersList").addEventListener("change", async e => {
    const sel = e.target.closest("select[data-order-status]");
    if (!sel) return;
    const { error } = await sb.from("orders").update({ status: sel.value }).eq("id", sel.dataset.orderStatus);
    if (error) alert("ሁኔታውን ማዘመን አልተቻለም፦ " + error.message);
    else await loadOrders();
  });

  document.getElementById("refreshOrders").addEventListener("click", loadOrders);

  // --- Render Customers ---
  function renderCustomers() {
    const box = document.getElementById("customersList");
    if (!customers.length) {
      box.innerHTML = '<div class="empty">ደንበኞች ሲመዘገቡ እዚህ ይታያሉ።</div>';
      return;
    }
    box.innerHTML = `<table><thead><tr><th>ስም</th><th>ስልክ</th><th>ሚና</th><th>የተመዘገበበት ቀን</th></tr></thead><tbody>` +
      customers.map(c => `<tr>
        <td>${esc(c.full_name || "—")}</td>
        <td>${esc(c.phone || "—")}</td>
        <td><span class="badge ${c.role === "owner" ? "on" : ""}">${esc(c.role)}</span></td>
        <td>${new Date(c.created_at).toLocaleDateString()}</td>
      </tr>`).join("") + "</tbody></table>";
  }

  checkOwnerSession();
</script>
</body>
</html>
