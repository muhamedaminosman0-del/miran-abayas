<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miran Express | Luxury Abayas Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aliexpressOrange: '#FF6A00', cream: '#FAF8F5', creamDark: '#F0ECE1', 
                        charcoal: '#1A1A1A', gold: '#C5A059'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF8F5; color: #1A1A1A; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #FF6A00; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
    </style>
</head>
<body class="bg-cream text-charcoal">

    <!-- Top Utility Bar -->
    <div class="bg-charcoal text-cream text-[11px] py-2 px-4 flex justify-between items-center z-50 relative">
        <div class="max-w-7xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-4">
                <span><i class="fa-solid fa-tags text-aliexpressOrange mr-1"></i> Wholesale Discounts: 3+ pcs (10%) | 5+ pcs (15%) | 10+ pcs (20%)</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="auth-btn" class="text-aliexpressOrange font-bold flex items-center gap-1 hover:underline">
                    <i class="fa-solid fa-lock text-[10px]"></i> Vendor Portal
                </button>
            </div>
        </div>
    </div>

    <!-- Header & Search -->
    <header class="sticky top-0 z-40 bg-white border-b border-gold/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <a href="#" class="flex flex-col items-start shrink-0">
                <div class="flex items-center gap-1">
                    <span class="font-serif text-2xl sm:text-3xl font-extrabold text-charcoal">Miran</span>
                    <span class="bg-aliexpressOrange text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider">Express</span>
                </div>
                <span class="text-[9px] uppercase tracking-[0.2em] text-gold font-bold">Global Marketplace</span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl hidden md:flex items-center">
                <div class="flex w-full border-2 border-aliexpressOrange rounded-full overflow-hidden bg-cream/30">
                    <input type="text" id="search-input" placeholder="🔍 Search luxury abayas, colors, kimono..." class="w-full px-5 py-2.5 text-sm bg-transparent outline-none">
                    <button id="search-btn" class="bg-aliexpressOrange hover:bg-orange-600 text-white px-6 py-2.5 text-xs font-bold uppercase flex items-center gap-1.5">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3">
                <button id="admin-panel-btn" class="hidden bg-aliexpressOrange hover:bg-orange-600 text-white px-3 py-2 text-xs font-bold rounded flex items-center gap-1.5 shadow uppercase">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Add Abaya</span>
                </button>
                <button id="cart-btn" class="relative flex items-center gap-2 bg-charcoal hover:bg-gold text-cream px-3 py-2 rounded transition-colors">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span class="hidden sm:inline text-xs font-bold">Bag</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-aliexpressOrange text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                </button>
            </div>
        </div>

        <!-- Mobile Search -->
        <div class="md:hidden px-4 pb-3 bg-white">
            <div class="flex w-full border-2 border-aliexpressOrange rounded-full overflow-hidden bg-cream/30">
                <input type="text" id="mobile-search-input" placeholder="Search abayas..." class="w-full px-4 py-2 text-xs bg-transparent outline-none">
            </div>
        </div>

        <!-- Categories Navigation -->
        <div class="bg-creamDark/60 border-t border-gold/15 overflow-x-auto">
            <div class="max-w-7xl mx-auto px-4 flex items-center space-x-6 text-xs uppercase tracking-wider font-semibold py-2.5 whitespace-nowrap">
                <button class="filter-btn text-aliexpressOrange font-bold border-b-2 border-aliexpressOrange pb-0.5" data-filter="all">All Products</button>
                <button class="filter-btn text-charcoal/80 hover:text-aliexpressOrange transition-colors" data-filter="classic">Classic Black</button>
                <button class="filter-btn text-charcoal/80 hover:text-aliexpressOrange transition-colors" data-filter="embroidered">Embroidered</button>
                <button class="filter-btn text-charcoal/80 hover:text-aliexpressOrange transition-colors" data-filter="pastel">Pastel & Colored</button>
                <button class="filter-btn text-charcoal/80 hover:text-aliexpressOrange transition-colors" data-filter="kimono">Kimono Style</button>
            </div>
        </div>
    </header>

    <!-- Products Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-[50vh]">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gold/20">
            <div>
                <h1 class="font-serif text-2xl sm:text-3xl font-bold text-charcoal">Featured Abayas</h1>
                <p class="text-xs text-charcoal/60 mt-0.5">Showing verified direct-from-atelier luxury abayas</p>
            </div>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
    </main>

    <!-- VENDOR ADD ABAYA MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden bg-charcoal/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-cream max-w-xl w-full border border-gold/40 shadow-2xl p-6 sm:p-8 relative my-8 max-h-[92vh] overflow-y-auto rounded-lg">
            <button id="close-admin-btn" class="absolute top-4 right-4 w-9 h-9 bg-creamDark rounded-full flex items-center justify-center hover:bg-aliexpressOrange hover:text-white transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="mb-5">
                <span class="text-xs uppercase tracking-widest text-aliexpressOrange font-bold">Verified Vendor Portal</span>
                <h3 class="font-serif text-2xl font-bold mt-1">Publish New Abaya</h3>
            </div>

            <form id="add-product-form" class="space-y-4">
                <!-- Image Upload -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1.5">1. Main Abaya Photo *</label>
                    <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-aliexpressOrange/50 hover:border-aliexpressOrange bg-white cursor-pointer overflow-hidden rounded relative">
                        <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-4 pb-5 text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-aliexpressOrange mb-1.5"></i>
                            <p class="text-xs font-semibold">Tap to upload photo</p>
                        </div>
                        <img id="photo-preview" src="" class="hidden w-full h-full object-contain bg-creamDark">
                        <input id="new-product-photo" type="file" accept="image/*" class="hidden" required>
                    </label>
                </div>

                <!-- Basic Info -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">2. Abaya Title *</label>
                    <input type="text" id="new-product-name" required placeholder="e.g. Royal Gold Embroidered Nidah" class="w-full bg-white border border-gold/30 px-3 py-2 text-sm rounded outline-none focus:border-aliexpressOrange">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider mb-1">3. Category *</label>
                        <select id="new-product-category" class="w-full bg-white border border-gold/30 px-3 py-2 text-sm rounded outline-none">
                            <option value="classic">Classic Black</option>
                            <option value="embroidered">Embroidered</option>
                            <option value="pastel">Pastel & Colored</option>
                            <option value="kimono">Kimono Style</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider mb-1">4. Base Price (ETB) *</label>
                        <input type="number" id="new-product-price" required placeholder="e.g. 4500" class="w-full bg-white border border-gold/30 px-3 py-2 text-sm rounded outline-none focus:border-aliexpressOrange">
                    </div>
                </div>
                <p id="price-preview" class="text-[11px] text-aliexpressOrange font-semibold -mt-2"></p>

                <!-- Color Variants -->
                <div class="bg-white p-3.5 border border-gold/40 rounded space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold uppercase tracking-wider">5. Color Variants & Photos</label>
                        <button type="button" id="add-color-variant-btn" class="bg-charcoal hover:bg-aliexpressOrange text-white px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider rounded transition-colors">
                            <i class="fa-solid fa-plus mr-1"></i> Add Color
                        </button>
                    </div>
                    <div id="color-variants-container" class="space-y-2.5"></div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="save-submit-btn" class="w-full bg-aliexpressOrange hover:bg-orange-600 text-white py-3 text-xs uppercase tracking-widest font-bold rounded shadow transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish to Marketplace
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- PRODUCT DETAIL MODAL -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-charcoal/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-cream max-w-4xl w-full border border-gold/30 shadow-2xl overflow-hidden relative my-8 rounded-xl flex flex-col md:flex-row">
            <button id="close-modal-btn" class="absolute top-4 right-4 w-9 h-9 bg-white/50 backdrop-blur rounded-full flex items-center justify-center hover:bg-aliexpressOrange hover:text-white transition-colors z-20 shadow">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="bg-white md:w-1/2 flex flex-col border-r border-gold/20">
                <div class="relative w-full aspect-[4/5] bg-creamDark flex items-center justify-center p-2">
                    <img id="modal-img" src="" class="w-full h-full object-cover rounded shadow-sm">
                </div>
                <div id="modal-thumbnails" class="flex gap-2 p-3 overflow-x-auto bg-white border-t border-gold/10"></div>
            </div>
            
            <div class="p-6 md:w-1/2 flex flex-col justify-between bg-cream">
                <div>
                    <span id="modal-category" class="text-xs uppercase tracking-widest text-aliexpressOrange font-extrabold"></span>
                    <h3 id="modal-title" class="font-serif text-2xl font-bold mt-1 mb-2"></h3>
                    <div class="flex items-center gap-3 mb-4">
                        <span id="modal-price" class="text-2xl font-extrabold text-aliexpressOrange"></span>
                        <span class="text-xs bg-red-100 text-aliexpressOrange px-2 py-0.5 rounded font-bold">10% OFF 3+ items</span>
                    </div>

                    <div class="mb-5">
                        <label class="block text-xs uppercase tracking-wider font-bold mb-2">Color: <span id="selected-color-label" class="text-aliexpressOrange font-semibold"></span></label>
                        <div id="modal-color-options" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div class="mb-5">
                        <label class="block text-xs uppercase tracking-wider font-bold mb-2">Size (Length):</label>
                        <div class="grid grid-cols-5 gap-2" id="size-options">
                            <button class="size-btn border-2 border-aliexpressOrange bg-aliexpressOrange text-white py-2 text-xs font-bold rounded" data-size="52">52</button>
                            <button class="size-btn border border-gold/40 hover:border-aliexpressOrange py-2 text-xs font-bold rounded" data-size="54">54</button>
                            <button class="size-btn border border-gold/40 hover:border-aliexpressOrange py-2 text-xs font-bold rounded" data-size="56">56</button>
                            <button class="size-btn border border-gold/40 hover:border-aliexpressOrange py-2 text-xs font-bold rounded" data-size="58">58</button>
                            <button class="size-btn border border-gold/40 hover:border-aliexpressOrange py-2 text-xs font-bold rounded" data-size="60">60</button>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-xs uppercase tracking-wider font-bold mb-2">Quantity:</label>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center border border-gold/40 bg-white rounded">
                                <button id="qty-minus" class="px-3 py-1.5 text-sm font-bold hover:bg-aliexpressOrange hover:text-white">-</button>
                                <input type="number" id="modal-qty" value="1" min="1" class="w-12 text-center text-xs font-bold outline-none border-x border-gold/20">
                                <button id="qty-plus" class="px-3 py-1.5 text-sm font-bold hover:bg-aliexpressOrange hover:text-white">+</button>
                            </div>
                            <span id="modal-bulk-hint" class="text-[11px] text-aliexpressOrange font-bold bg-orange-50 px-2 py-1 rounded border border-orange-100"></span>
                        </div>
                    </div>
                </div>

                <div class="space-y-2 pt-4 border-t border-gold/20">
                    <button id="modal-add-to-cart" class="w-full bg-aliexpressOrange hover:bg-orange-600 text-white py-3.5 text-xs uppercase tracking-widest font-bold rounded shadow-md transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cart-plus text-base"></i> Add to Bag
                    </button>
                    <button id="modal-delete-product" class="hidden w-full border border-red-300 text-red-600 hover:bg-red-50 py-2 text-[11px] uppercase tracking-wider font-semibold rounded mt-2">
                        <i class="fa-solid fa-trash-can mr-1"></i> Delete Product (Admin Only)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 z-50 hidden">
        <div id="cart-overlay" class="absolute inset-0 bg-charcoal/60 backdrop-blur-sm"></div>
        <div class="absolute top-0 right-0 w-full max-w-md h-full bg-cream shadow-2xl flex flex-col justify-between overflow-y-auto">
            <div class="p-5 border-b border-gold/20 flex items-center justify-between bg-creamDark sticky top-0 z-10">
                <h3 class="font-serif text-xl font-bold">Shopping Bag</h3>
                <button id="close-cart-btn" class="hover:text-aliexpressOrange text-lg font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="cart-items" class="p-5 space-y-3 flex-1"></div>

            <div class="p-5 bg-creamDark/25 border-t border-gold/20 space-y-4">
                <div class="bg-white p-3.5 border border-gold/25 rounded space-y-2 text-xs">
                    <div class="flex justify-between"><span class="text-charcoal/70">Subtotal:</span><span id="cart-subtotal" class="font-semibold">0 ETB</span></div>
                    <div id="discount-row" class="hidden flex justify-between text-green-700 font-bold"><span id="discount-label"></span><span id="discount-amount"></span></div>
                    <div class="flex justify-between font-bold text-sm border-t border-gold/15 pt-2"><span>Grand Total:</span><span id="cart-total" class="text-aliexpressOrange">0 ETB</span></div>
                </div>

                <div class="space-y-2">
                    <input type="text" id="cust-name" placeholder="Full name *" class="w-full bg-white border border-gold/30 px-3 py-2 text-xs rounded outline-none">
                    <input type="tel" id="cust-phone" placeholder="Phone number *" class="w-full bg-white border border-gold/30 px-3 py-2 text-xs rounded outline-none">
                </div>

                <button id="telegram-checkout-btn" class="w-full bg-[#229ED9] hover:bg-[#1b86b8] text-white py-3.5 text-xs uppercase font-bold rounded flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-brands fa-telegram text-base"></i> Send Order to Admin
                </button>
            </div>
        </div>
    </div>

    <script>
        // Fixing Javascript String Syntax Error
        const VENDOR_MARKUP = 1.10; 
        
        const defaultProducts = [
            {
                id: "def-1", name: "Midnight Royal Nidah Abaya", category: "classic", categoryLabel: "Classic Black", price: 4800, rating: "4.9", sold: "1.4k+",
                colorVariants: [
                    { name: "Royal Black", hex: "#1A1A1A", img: "https://images.unsplash.com/photo-1584273143981-41c073dfe8f8?q=80&w=800&auto=format&fit=crop" },
                    { name: "Deep Maroon", hex: "#5C1A26", img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=800&auto=format&fit=crop" }
                ],
                img: "https://images.unsplash.com/photo-1584273143981-41c073dfe8f8?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: "def-2", name: "Sage Mist Butterfly Abaya", category: "pastel", categoryLabel: "Pastel & Colored", price: 4900, rating: "5.0", sold: "900+",
                colorVariants: [
                    { name: "Sage Green", hex: "#9CAF88", img: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?q=80&w=800&auto=format&fit=crop" },
                    { name: "Dusty Rose", hex: "#C99A9E", img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&auto=format&fit=crop" }
                ],
                img: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: "def-3", name: "Desert Sand Linen Kimono", category: "kimono", categoryLabel: "Kimono Style", price: 5200, rating: "4.8", sold: "2.1k+",
                colorVariants: [
                    { name: "Beige", hex: "#D8C7B0", img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&auto=format&fit=crop" }
                ],
                img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&auto=format&fit=crop"
            }
        ];

        let products = JSON.parse(localStorage.getItem('miran_full_db')) || defaultProducts;
        let cart = JSON.parse(localStorage.getItem('miran_cart')) || [];
        let isVendor = localStorage.getItem('miran_is_vendor') === 'true';

        const $ = id => document.getElementById(id);
        const formatMoney = num => `${Math.round(num).toLocaleString()} ETB`;

        function updateVendorUI() {
            $('admin-panel-btn').classList.toggle('hidden', !isVendor);
            $('auth-btn').innerHTML = isVendor ? '<i class="fa-solid fa-right-from-bracket text-[10px]"></i> Logout' : '<i class="fa-solid fa-lock text-[10px]"></i> Vendor Portal';
        }

        $('auth-btn').addEventListener('click', () => {
            if (isVendor) {
                isVendor = false; localStorage.setItem('miran_is_vendor', 'false');
            } else {
                if (prompt("Enter Admin Password:") === "miran2026") {
                    isVendor = true; localStorage.setItem('miran_is_vendor', 'true');
                } else alert("Access Denied");
            }
            updateVendorUI();
            renderGrid();
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const cvs = document.createElement('canvas');
                        cvs.width = 600; cvs.height = Math.round(img.height * (600/img.width));
                        cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
                        resolve(cvs.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // --- ADMIN: Upload Product ---
        let mainPhotoData = "";
        $('admin-panel-btn').addEventListener('click', () => {
            $('admin-modal').classList.remove('hidden');
            $('color-variants-container').innerHTML = '';
            addColorVariantRow("Standard Black", "#1A1A1A"); 
        });
        $('close-admin-btn').addEventListener('click', () => $('admin-modal').classList.add('hidden'));

        $('new-product-photo').addEventListener('change', async e => {
            if(e.target.files[0]) {
                mainPhotoData = await compressImage(e.target.files[0]);
                $('photo-preview').src = mainPhotoData;
                $('photo-preview').classList.remove('hidden');
                $('upload-placeholder').classList.add('hidden');
            }
        });

        $('new-product-price').addEventListener('input', e => {
            const val = Number(e.target.value);
            if(val > 0) $('price-preview').textContent = `Customer sees: ${Math.round(val * VENDOR_MARKUP).toLocaleString()} ETB (Includes 10% Markup)`;
            else $('price-preview').textContent = '';
        });

        function addColorVariantRow(defName = "", defHex = "#1A1A1A") {
            const div = document.createElement('div');
            div.className = "variant-row bg-cream/70 p-2 border border-gold/30 rounded flex items-center gap-2";
            div._img = "";
            div.innerHTML = `
                <input type="color" value="${defHex}" class="var-hex w-7 h-7 border border-gold/40 cursor-pointer bg-transparent">
                <input type="text" value="${defName}" placeholder="Color Name" class="var-name flex-1 bg-white border border-gold/30 px-2 py-1 text-xs rounded outline-none">
                <label class="cursor-pointer bg-white border border-gold/40 px-2 py-1 text-[11px] font-bold rounded">
                    <i class="fa-solid fa-camera text-aliexpressOrange"></i> Photo
                    <input type="file" accept="image/*" class="var-photo hidden">
                </label>
                <img src="" class="var-thumb hidden w-7 h-7 object-cover border rounded">
                <button type="button" class="text-red-500 hover:text-red-700 px-1" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash-can"></i></button>
            `;
            div.querySelector('.var-photo').addEventListener('change', async e => {
                if(e.target.files[0]) {
                    div._img = await compressImage(e.target.files[0]);
                    const thumb = div.querySelector('.var-thumb');
                    thumb.src = div._img;
                    thumb.classList.remove('hidden');
                }
            });
            $('color-variants-container').appendChild(div);
        }
        $('add-color-variant-btn').addEventListener('click', () => addColorVariantRow());

        $('add-product-form').addEventListener('submit', e => {
            e.preventDefault();
            if(!mainPhotoData) return alert("Upload main photo first!");
            $('save-submit-btn').textContent = "Publishing...";
            
            const variants = [...document.querySelectorAll('.variant-row')].map(r => ({
                name: r.querySelector('.var-name').value.trim() || "Standard",
                hex: r.querySelector('.var-hex').value,
                img: r._img || mainPhotoData 
            }));

            const cat = $('new-product-category');
            const newAbaya = {
                id: 'prod_' + Date.now(),
                name: $('new-product-name').value.trim(),
                category: cat.value,
                categoryLabel: cat.options[cat.selectedIndex].text,
                price: Math.round(Number($('new-product-price').value) * VENDOR_MARKUP), 
                img: mainPhotoData,
                colorVariants: variants,
                rating: "5.0", sold: "New!"
            };

            products.unshift(newAbaya);
            localStorage.setItem('miran_full_db', JSON.stringify(products));
            
            e.target.reset();
            $('photo-preview').classList.add('hidden');
            $('upload-placeholder').classList.remove('hidden');
            mainPhotoData = "";
            $('admin-modal').classList.add('hidden');
            $('save-submit-btn').innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish to Marketplace`;
            
            renderGrid();
        });

        // --- MARKETPLACE GRID ---
        let currentFilter = 'all';
        let currentSearch = '';

        function renderGrid() {
            const grid = $('product-grid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => {
                return (currentFilter === 'all' || p.category === currentFilter) && p.name.toLowerCase().includes(currentSearch.toLowerCase());
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-12 text-gray-500">No products match your search.</p>';
                return;
            }

            filtered.forEach(p => {
                const dots = (p.colorVariants || []).map(v => `<span class="w-3 h-3 rounded-full border border-charcoal/30 inline-block" style="background-color:${v.hex}"></span>`).join('');
                
                grid.innerHTML += `
                    <div class="bg-white rounded-lg border border-gold/30 shadow-sm hover:shadow-xl transition-all flex flex-col justify-between overflow-hidden cursor-pointer group" onclick="openProduct('${p.id}')">
                        <div class="relative aspect-[3/4] w-full bg-creamDark overflow-hidden">
                            <img src="${p.img}" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 ease-out">
                            <span class="absolute top-2 left-2 bg-aliexpressOrange text-white text-[9px] font-extrabold uppercase px-2 py-0.5 rounded shadow">Wholesale Deal</span>
                            <div class="absolute bottom-2 left-2 bg-charcoal/80 text-cream text-[9px] px-2 py-0.5 rounded">⭐ ${p.rating} | ${p.sold}</div>
                        </div>
                        <div class="p-3.5 flex flex-col justify-between flex-1">
                            <div>
                                <h3 class="font-serif text-sm font-bold line-clamp-2 mb-1.5 group-hover:text-aliexpressOrange transition-colors">${p.name}</h3>
                                <div class="flex gap-1.5 mb-2">${dots}</div>
                            </div>
                            <div class="mt-2 flex justify-between items-baseline">
                                <span class="text-lg font-extrabold text-aliexpressOrange">${formatMoney(p.price)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('border-b-2', 'text-aliexpressOrange'));
                e.target.classList.add('border-b-2', 'text-aliexpressOrange');
                currentFilter = e.target.dataset.filter;
                renderGrid();
            });
        });
        
        const applySearch = val => { currentSearch = val; renderGrid(); };
        $('search-input').addEventListener('input', e => applySearch(e.target.value));
        $('mobile-search-input').addEventListener('input', e => applySearch(e.target.value));

        // --- PRODUCT MODAL ---
        let selectedProduct = null;
        let selectedColor = null;
        let selectedSize = '54';

        function openProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            
            $('modal-category').textContent = selectedProduct.categoryLabel || 'Modest Fashion';
            $('modal-title').textContent = selectedProduct.name;
            $('modal-price').textContent = formatMoney(selectedProduct.price);
            
            const colorOpts = $('modal-color-options');
            const thumbnailsOpts = $('modal-thumbnails');
            colorOpts.innerHTML = '';
            thumbnailsOpts.innerHTML = '';
            
            const vars = selectedProduct.colorVariants && selectedProduct.colorVariants.length ? selectedProduct.colorVariants : [{name: "Standard", hex: "#1A1A1A", img: selectedProduct.img}];
            
            addThumbnail(selectedProduct.img, true);

            vars.forEach((v, idx) => {
                const cBtn = document.createElement('button');
                cBtn.className = `p-0.5 border-2 rounded ${idx===0 ? 'border-aliexpressOrange' : 'border-transparent hover:border-gold/50'} transition-all`;
                cBtn.innerHTML = `<img src="${v.img}" class="w-9 h-9 object-cover rounded-sm">`;
                
                cBtn.addEventListener('click', () => {
                    document.querySelectorAll('#modal-color-options button').forEach(b => b.className = 'p-0.5 border-2 border-transparent hover:border-gold/50 rounded transition-all');
                    cBtn.className = 'p-0.5 border-2 border-aliexpressOrange rounded transition-all';
                    selectColor(v);
                    
                    document.querySelectorAll('#modal-thumbnails img').forEach(t => t.classList.remove('border-aliexpressOrange', 'border-2'));
                    const matchingThumb = [...document.querySelectorAll('#modal-thumbnails img')].find(img => img.src === v.img);
                    if(matchingThumb) matchingThumb.classList.add('border-aliexpressOrange', 'border-2');
                });
                colorOpts.appendChild(cBtn);

                if(v.img !== selectedProduct.img) {
                    addThumbnail(v.img, false);
                }
            });
            
            selectColor(vars[0]); 
            $('modal-qty').value = 1;
            updateModalBulkHint();

            const delBtn = $('modal-delete-product');
            delBtn.classList.toggle('hidden', !isVendor);
            delBtn.onclick = () => {
                if(confirm("Are you sure you want to delete this product?")) {
                    products = products.filter(p => p.id !== id);
                    localStorage.setItem('miran_full_db', JSON.stringify(products));
                    $('product-modal').classList.add('hidden');
                    renderGrid();
                }
            };

            $('product-modal').classList.remove('hidden');
        }

        function addThumbnail(imgSrc, isMain) {
            const thumb = document.createElement('img');
            thumb.src = imgSrc;
            thumb.className = `w-14 h-14 object-cover rounded cursor-pointer border ${isMain ? 'border-2 border-aliexpressOrange' : 'border-gold/30 hover:border-aliexpressOrange'}`;
            thumb.addEventListener('click', () => {
                document.querySelectorAll('#modal-thumbnails img').forEach(t => t.className = 'w-14 h-14 object-cover rounded cursor-pointer border border-gold/30 hover:border-aliexpressOrange');
                thumb.className = 'w-14 h-14 object-cover rounded cursor-pointer border-2 border-aliexpressOrange';
                $('modal-img').src = imgSrc;
            });
            $('modal-thumbnails').appendChild(thumb);
        }

        function selectColor(variant) {
            selectedColor = variant;
            $('selected-color-label').textContent = variant.name;
            $('modal-img').src = variant.img;
        }

        $('close-modal-btn').addEventListener('click', () => $('product-modal').classList.add('hidden'));
        
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.className = 'size-btn border border-gold/40 hover:border-aliexpressOrange py-2 text-xs font-bold rounded');
                e.target.className = 'size-btn border-2 border-aliexpressOrange bg-aliexpressOrange text-white py-2 text-xs font-bold rounded';
                selectedSize = e.target.dataset.size;
            });
        });

        function updateModalBulkHint() {
            const q = parseInt($('modal-qty').value) || 1;
            const hint = $('modal-bulk-hint');
            if(q >= 10) hint.innerHTML = "🔥 <b>20%</b> wholesale discount applied!";
            else if(q >= 5) hint.innerHTML = "🔥 <b>15%</b> bulk discount applied!";
            else if(q >= 3) hint.innerHTML = "🔥 <b>10%</b> bulk discount applied!";
            else hint.innerHTML = "Add 3+ for 10% OFF";
        }
        $('qty-minus').addEventListener('click', () => { let v = parseInt($('modal-qty').value); if(v > 1) $('modal-qty').value = v - 1; updateModalBulkHint(); });
        $('qty-plus').addEventListener('click', () => { $('modal-qty').value = parseInt($('modal-qty').value) + 1; updateModalBulkHint(); });
        $('modal-qty').addEventListener('input', updateModalBulkHint);

        // --- CART & CHECKOUT ---
        $('modal-add-to-cart').addEventListener('click', () => {
            const qty = parseInt($('modal-qty').value) || 1;
            const exists = cart.find(i => i.id === selectedProduct.id && i.size === selectedSize && i.color === selectedColor.name);
            if(exists) exists.qty += qty;
            else {
                cart.push({
                    id: selectedProduct.id, name: selectedProduct.name, price: selectedProduct.price,
                    img: selectedColor.img, color: selectedColor.name, hex: selectedColor.hex, size: selectedSize, qty: qty
                });
            }
            $('product-modal').classList.add('hidden');
            updateCartUI();
            $('cart-drawer').classList.remove('hidden');
        });

        $('cart-btn').addEventListener('click', () => $('cart-drawer').classList.remove('hidden'));
        $('close-cart-btn').addEventListener('click', () => $('cart-drawer').classList.add('hidden'));

        function updateCartUI() {
            localStorage.setItem('miran_cart', JSON.stringify(cart));
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            $('cart-badge').textContent = totalQty;
            const itemsCont = $('cart-items');
            if(cart.length === 0) {
                itemsCont.innerHTML = '<p class="text-center text-gray-400 mt-10">Your bag is empty.</p>';
                $('cart-subtotal').textContent = "0 ETB";
                $('cart-total').textContent = "0 ETB";
                $('discount-row').classList.add('hidden');
                return;
            }

            itemsCont.innerHTML = cart.map((item, idx) => `
                <div class="flex gap-3 bg-white p-2.5 border border-gold/15 rounded items-center">
                    <img src="${item.img}" class="w-14 h-16 object-cover rounded bg-creamDark">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-serif font-bold text-xs truncate">${item.name}</h4>
                        <p class="text-[11px] text-gray-500 mt-1">Color: <strong>${item.color}</strong> | Size: <strong>${item.size}</strong></p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-xs font-bold bg-gray-100 px-2 rounded">Qty: ${item.qty}</span>
                            <span class="text-xs font-bold text-aliexpressOrange ml-auto">${formatMoney(item.price * item.qty)}</span>
                        </div>
                    </div>
                    <button class="text-red-400 hover:text-red-600 px-2" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash-can text-sm"></i></button>
                </div>
            `).join('');

            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let discountRate = totalQty >= 10 ? 0.20 : totalQty >= 5 ? 0.15 : totalQty >= 3 ? 0.10 : 0;
            const discountAmt = subtotal * discountRate;
            const grandTotal = subtotal - discountAmt;

            $('cart-subtotal').textContent = formatMoney(subtotal);
            $('cart-total').textContent = formatMoney(grandTotal);
            if(discountRate > 0) {
                $('discount-row').classList.remove('hidden');
                $('discount-label').textContent = `Bulk Discount (${discountRate*100}%):`;
                $('discount-amount').textContent = `- ${formatMoney(discountAmt)}`;
            } else $('discount-row').classList.add('hidden');
        }
        
        window.removeFromCart = (idx) => { cart.splice(idx, 1); updateCartUI(); };

        $('telegram-checkout-btn').addEventListener('click', () => {
            if(cart.length === 0) return alert("Bag is empty!");
            const name = $('cust-name').value;
            const phone = $('cust-phone').value;
            if(!name || !phone) return alert("Please enter name and phone number!");

            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let rate = totalQty >= 10 ? 0.2 : totalQty >= 5 ? 0.15 : totalQty >= 3 ? 0.1 : 0;
            const discount = subtotal * rate;
            const final = subtotal - discount;

            const lines = cart.map((i, idx) => `${idx+1}. ${i.name} [Color: ${i.color} | Size: ${i.size}] x${i.qty} = ${formatMoney(i.price * i.qty)}`).join('\n');
            let msg = `✨ MIRAN EXPRESS ORDER ✨\n\n👤 Customer: ${name}\n📞 Phone: ${phone}\n\n🛍️ Items (${totalQty} pcs):\n${lines}\n\n💵 Subtotal: ${formatMoney(subtotal)}`;
            if(rate > 0) msg += `\n🏷️ Wholesale Discount (${rate*100}%): -${formatMoney(discount)}`;
            msg += `\n💰 GRAND TOTAL: ${formatMoney(final)}\n\nPlease confirm my order.`;

            window.open(`https://t.me/mame15?text=${encodeURIComponent(msg)}`, '_blank');
        });

        // INIT
        updateVendorUI();
        renderGrid();
        updateCartUI();
    </script>
</body>
</html>
