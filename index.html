<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miran Express | Luxury Abayas Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aliexpressOrange: '#FF6A00', cream: '#FAF8F5', creamDark: '#F0ECE1', 
                        charcoal: '#1A1A1A', gold: '#C5A059'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF8F5; color: #1A1A1A; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-cream text-charcoal">

    <!-- Top Utility Bar -->
    <div class="bg-charcoal text-cream text-[11px] py-2 px-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <span><i class="fa-solid fa-tags text-aliexpressOrange"></i> Wholesale Discounts: 3+ (10%) | 5+ (15%)</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="auth-btn" class="text-aliexpressOrange font-bold flex items-center gap-1">
                <i class="fa-solid fa-lock"></i> Vendor Portal
            </button>
        </div>
    </div>

    <!-- Header & Search -->
    <header class="sticky top-0 z-40 bg-white border-b border-gold/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
            <a href="#" class="flex flex-col items-start shrink-0">
                <div class="flex items-center gap-1">
                    <span class="font-serif text-2xl font-extrabold text-charcoal">Miran</span>
                    <span class="bg-aliexpressOrange text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded uppercase">Express</span>
                </div>
                <span class="text-[9px] uppercase tracking-[0.2em] text-gold font-bold">Global Marketplace</span>
            </a>

            <div class="flex-1 max-w-xl hidden md:flex">
                <div class="flex w-full border-2 border-aliexpressOrange rounded-full overflow-hidden bg-cream/30">
                    <input type="text" id="search-input" placeholder="Search luxury abayas..." class="w-full px-5 py-2 text-sm bg-transparent outline-none">
                    <button id="search-btn" class="bg-aliexpressOrange text-white px-6 py-2 text-xs font-bold uppercase"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="admin-panel-btn" class="hidden bg-aliexpressOrange text-white px-3 py-2 text-xs font-bold rounded uppercase"><i class="fa-solid fa-plus"></i> Add Abaya</button>
                <button id="cart-btn" class="relative bg-charcoal text-cream px-3 py-2 rounded text-lg">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-aliexpressOrange text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
        
        <!-- Categories -->
        <div class="bg-creamDark/60 border-t border-gold/15 overflow-x-auto">
            <div class="max-w-7xl mx-auto px-4 flex items-center space-x-6 text-xs uppercase tracking-wider font-semibold py-2.5">
                <button class="filter-btn text-aliexpressOrange font-bold border-b-2 border-aliexpressOrange" data-filter="all">All Products</button>
                <button class="filter-btn text-charcoal/80" data-filter="classic">Classic Black</button>
                <button class="filter-btn text-charcoal/80" data-filter="embroidered">Embroidered</button>
                <button class="filter-btn text-charcoal/80" data-filter="pastel">Pastel & Colored</button>
            </div>
        </div>
    </header>

    <!-- Products Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8 min-h-[60vh]">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gold/20">
            <h1 class="font-serif text-2xl font-bold text-charcoal">Featured Abayas</h1>
            <span class="text-xs font-semibold text-aliexpressOrange bg-white px-3 py-1.5 border border-gold/30 rounded">Fast Delivery</span>
        </div>
        
        <!-- Products will be generated here -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- Admin Upload Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 hidden z-50 overflow-y-auto p-4 flex items-center justify-center">
        <div class="bg-white max-w-lg w-full rounded-lg shadow-2xl overflow-hidden p-6 relative">
            <button id="close-admin-btn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="font-bold font-serif text-2xl mb-4 text-aliexpressOrange">Vendor Portal</h2>
            <form id="upload-form" class="space-y-4">
                <input type="text" id="prod-name" placeholder="Abaya Name" class="w-full border border-gold/40 p-2 text-sm rounded focus:outline-none" required>
                <input type="number" id="prod-price" placeholder="Wholesale Price (ETB)" class="w-full border border-gold/40 p-2 text-sm rounded focus:outline-none" required>
                <select id="prod-cat" class="w-full border border-gold/40 p-2 text-sm rounded focus:outline-none">
                    <option value="classic">Classic Black</option>
                    <option value="embroidered">Embroidered</option>
                    <option value="pastel">Pastel & Colored</option>
                </select>
                <input type="file" id="prod-image" accept="image/*" class="w-full text-sm border border-gold/40 p-2 rounded" required>
                <button type="submit" class="bg-aliexpressOrange text-white px-4 py-3 text-sm font-bold uppercase rounded w-full">Publish Abaya</button>
            </form>
        </div>
    </div>

    <!-- Product Detail / Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 hidden z-50 overflow-y-auto p-4 flex items-center justify-center">
        <div class="bg-white max-w-2xl w-full rounded-lg shadow-2xl overflow-hidden relative grid grid-cols-1 md:grid-cols-2">
            <button id="close-checkout-btn" class="absolute top-3 right-3 text-gray-500 hover:text-red-500 text-xl z-10 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow"><i class="fa-solid fa-xmark"></i></button>
            <div class="bg-creamDark/50 p-4 flex justify-center items-center">
                <img id="modal-img" src="" class="max-h-[300px] object-contain rounded shadow">
            </div>
            <div class="p-6">
                <h3 id="modal-title" class="font-serif text-xl font-bold mb-2"></h3>
                <p id="modal-price" class="text-2xl font-extrabold text-aliexpressOrange mb-4"></p>
                
                <label class="block text-xs font-bold uppercase mb-1">Select Size:</label>
                <div class="flex gap-2 mb-4">
                    <button class="size-btn border-2 border-aliexpressOrange bg-aliexpressOrange text-white px-3 py-1 text-xs font-bold rounded">54</button>
                    <button class="size-btn border border-gold/40 px-3 py-1 text-xs font-bold rounded">56</button>
                    <button class="size-btn border border-gold/40 px-3 py-1 text-xs font-bold rounded">58</button>
                </div>

                <label class="block text-xs font-bold uppercase mb-1">Quantity:</label>
                <input type="number" id="modal-qty" value="1" min="1" class="border border-gold/40 px-3 py-1 w-20 text-center text-sm font-bold rounded mb-4">
                
                <div class="space-y-2 mt-4 border-t pt-4">
                    <input type="text" id="cust-name" placeholder="Your Full Name" class="w-full border p-2 text-sm rounded">
                    <input type="text" id="cust-phone" placeholder="Phone Number" class="w-full border p-2 text-sm rounded">
                    <button id="buy-telegram-btn" class="w-full bg-[#229ED9] text-white py-3 text-sm font-bold rounded flex items-center justify-center gap-2">
                        <i class="fa-brands fa-telegram text-lg"></i> Send Order to Admin
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Fallback Default Products
        const defaultProducts = [
            { id: 1, name: "Midnight Royal Nidah Abaya", category: "classic", price: 4800, img: "https://images.unsplash.com/photo-1584273143981-41c073dfe8f8?q=80&w=800&auto=format&fit=crop" },
            { id: 2, name: "Zahara Gold Embroidered", category: "embroidered", price: 6500, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=800&auto=format&fit=crop" },
            { id: 3, name: "Sage Mist Butterfly Abaya", category: "pastel", price: 4900, img: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?q=80&w=800&auto=format&fit=crop" },
            { id: 4, name: "Desert Sand Linen Kimono", category: "classic", price: 5200, img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&auto=format&fit=crop" }
        ];

        let products = JSON.parse(localStorage.getItem('miran_products')) || defaultProducts;
        let selectedProduct = null;
        let selectedSize = '54';

        function renderProducts(filterCat = 'all', searchQuery = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            let filtered = products.filter(p => {
                const matchCat = filterCat === 'all' || p.category === filterCat;
                const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-gray-500">No abayas found.</p>';
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-lg border border-gold/30 shadow-sm hover:shadow-lg transition-all overflow-hidden">
                        <div class="relative h-[250px] bg-creamDark">
                            <img src="${p.img}" class="w-full h-full object-cover object-top">
                        </div>
                        <div class="p-3">
                            <h3 class="font-serif text-sm font-bold line-clamp-2 h-10">${p.name}</h3>
                            <div class="mt-2 flex justify-between items-end">
                                <span class="text-base font-extrabold text-aliexpressOrange">${Number(p.price).toLocaleString()} ETB</span>
                            </div>
                            <button onclick="openCheckout(${p.id})" class="w-full mt-3 bg-charcoal hover:bg-aliexpressOrange text-white py-2 text-xs font-bold rounded uppercase">
                                Buy Now
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('border-b-2', 'text-aliexpressOrange'));
                e.target.classList.add('border-b-2', 'text-aliexpressOrange');
                renderProducts(e.target.dataset.filter);
            });
        });

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderProducts('all', e.target.value);
        });

        // Image Compression
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 600; canvas.height = Math.round(img.height * (600/img.width));
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Admin Upload
        let isVendor = localStorage.getItem('miran_vendor') === 'true';
        function updateVendorUI() {
            document.getElementById('admin-panel-btn').classList.toggle('hidden', !isVendor);
            document.getElementById('auth-btn').innerHTML = isVendor ? '<i class="fa-solid fa-right-from-bracket"></i> Logout' : '<i class="fa-solid fa-lock"></i> Vendor Portal';
        }
        
        document.getElementById('auth-btn').addEventListener('click', () => {
            if(isVendor) {
                isVendor = false; localStorage.setItem('miran_vendor', 'false');
            } else {
                if(prompt("Enter Vendor Password:") === "miran2026") {
                    isVendor = true; localStorage.setItem('miran_vendor', 'true');
                } else {
                    alert("Incorrect Password");
                }
            }
            updateVendorUI();
        });

        document.getElementById('admin-panel-btn').addEventListener('click', () => {
            document.getElementById('admin-modal').classList.remove('hidden');
        });
        document.getElementById('close-admin-btn').addEventListener('click', () => {
            document.getElementById('admin-modal').classList.add('hidden');
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = "Publishing...";
            
            const file = document.getElementById('prod-image').files[0];
            const base64Img = await compressImage(file);
            
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('prod-name').value,
                price: Number(document.getElementById('prod-price').value),
                category: document.getElementById('prod-cat').value,
                img: base64Img
            };

            products.unshift(newProduct);
            localStorage.setItem('miran_products', JSON.stringify(products));
            
            e.target.reset();
            document.getElementById('admin-modal').classList.add('hidden');
            btn.textContent = "Publish Abaya";
            renderProducts();
            alert("Product Added Successfully!");
        });

        // Checkout Modal
        window.openCheckout = function(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modal-img').src = selectedProduct.img;
            document.getElementById('modal-title').textContent = selectedProduct.name;
            document.getElementById('modal-price').textContent = `${Number(selectedProduct.price).toLocaleString()} ETB`;
            document.getElementById('modal-qty').value = 1;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        document.getElementById('close-checkout-btn').addEventListener('click', () => {
            document.getElementById('checkout-modal').classList.add('hidden');
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.size-btn').forEach(b => b.className = 'size-btn border border-gold/40 px-3 py-1 text-xs font-bold rounded');
                e.target.className = 'size-btn border-2 border-aliexpressOrange bg-aliexpressOrange text-white px-3 py-1 text-xs font-bold rounded';
                selectedSize = e.target.textContent;
            });
        });

        document.getElementById('buy-telegram-btn').addEventListener('click', () => {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const qty = document.getElementById('modal-qty').value;
            
            if(!name || !phone) return alert("Please enter name and phone number");
            
            const total = selectedProduct.price * qty;
            let discountTxt = "";
            let finalTotal = total;
            
            if(qty >= 5) { finalTotal = total * 0.85; discountTxt = "(15% OFF)"; }
            else if(qty >= 3) { finalTotal = total * 0.90; discountTxt = "(10% OFF)"; }

            const msg = `🛍️ MIRAN ORDER

👤 Name: ${name}
📞 Phone: ${phone}
👗 Item: ${selectedProduct.name}
📏 Size: ${selectedSize}
🔢 Qty: ${qty}
💰 Total: ${finalTotal.toLocaleString()} ETB ${discountTxt}

Please confirm my order.`;
            
            window.open(`https://t.me/mame15?text=${encodeURIComponent(msg)}`, '_blank');
            document.getElementById('checkout-modal').classList.add('hidden');
        });

        // Initialize
        updateVendorUI();
        renderProducts();
    </script>
</body>
</html>
